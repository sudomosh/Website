<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | Islamic Psychology for Women</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary: #7b5ea7;
      --secondary: #1f1b2e;
      --bg: #f6f4fa;
      --card: #ffffff;
      --text: #2b2b2b;
      --accent: #e8def6;
    }

    body.dark {
      --bg: #14121c;
      --card: #1e1b2a;
      --text: #e6e4f0;
      --secondary: #0f0d16;
      --accent: #2a243d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      transition: all 0.4s ease;
    }

    header {
      background: linear-gradient(135deg, #7b5ea7, #a48bc9);
      color: #fff;
      padding: 90px 20px 70px;
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 10px;
    }

    header p {
      max-width: 650px;
      margin: auto;
      font-size: 1.1rem;
      opacity: 0.95;
    }

    #toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.25);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
      cursor: pointer;
      color: #fff;
    }

    section {
      padding: 80px 20px;
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    .contact-box {
      background: var(--card);
      padding: 45px 35px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      max-width: 650px;
      margin: auto;
    }

    .contact-box p {
      margin-bottom: 25px;
    }

    form {
      display: grid;
      gap: 20px;
      text-align: left;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #ccc;
      font-family: inherit;
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      margin-top: 10px;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
    }

    .note {
      margin-top: 20px;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    footer {
      background: var(--secondary);
      color: #fff;
      text-align: center;
      padding: 40px 20px;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>

<header>
  <button id="toggle">🌙</button>
  <h1>Contact Us</h1>
  <p>A safe space for sincere questions, reflections, and collaboration</p>
</header>

<section>
  <div class="contact-box">
    <p>
      This page is meant for respectful communication only.  
      Please keep messages aligned with Islamic etiquette.
    </p>

    <!-- GitHub Pages friendly form (no backend) -->
    <form action="https://formspree.io/f/xgozqajg" method="POST">
      
      <div>
        <label>Your Name</label>
        <input type="text" name="name" required>
      </div>

      <div>
        <label>Email Address</label>
        <input type="email" name="email" required>
      </div>

      <div>
        <label>Your Message</label>
        <textarea name="message" required></textarea>
      </div>

      <button type="submit">Send Message</button>
    </form>

    <div class="note">
      Messages are reviewed with care. This is not a crisis-support service.
    </div>
  </div>
</section>

<footer>
  <p id="year"></p>
</footer>

<script>
  // Dark mode
  const toggle = document.getElementById('toggle');
  toggle.onclick = () => {
    document.body.classList.toggle('dark');
    toggle.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  };

  // Footer year
  document.getElementById('year').innerText =
    `© ${new Date().getFullYear()} Islamic Psychology for Women · Built with intention & ihsaan`;
</script>

</body>
</html>
